name: Post Instagram cardnews

on:
  schedule:
    # GitHub 알람은 가끔 늦거나 빠져요. 그래서 4번 확인해요.
    # 이미 올린 날은 .posted 표시가 있어서 다시 올리지 않아요.
    # 17:50 KST
    - cron: "50 8 * * *"
    # 18:10 KST
    - cron: "10 9 * * *"
    # 18:40 KST
    - cron: "40 9 * * *"
    # 19:20 KST
    - cron: "20 10 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "게시할 폴더 날짜 (YYYY-MM-DD). 비우면 오늘(KST)"
        required: false

permissions:
  contents: write

concurrency:
  group: instagram-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 늦게 시작한 실행도 항상 '가장 새로운 main'을 보게 해요.
          # (이게 없으면 대기하던 실행이 옛날 상태를 보고 같은 글을 또 올려요)
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pillow requests

      - name: Post to Instagram
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          TARGET_DATE: ${{ github.event.inputs.date }}
          REPO: ${{ github.repository }}
        run: python scripts/post_instagram.py
